# ─────────────────────────────────────────────────────────────────────────────
# 使用說明
#   單一容器 (預設使用 GPU 1)：  docker compose up comfyui          → http://localhost:8188
#   GPU-0 專用容器    ：  docker compose up comfyui-gpu0     → http://localhost:8188
#   GPU-1 專用容器    ：  docker compose up comfyui-gpu1     → http://localhost:8189
#   兩張同時跑（各自狜立）：  docker compose up comfyui-gpu0 comfyui-gpu1
#   兩張 GPU 同時給一個容器（搭配 ComfyUI-MultiGPU 節點分派）：
#       docker compose --profile multi-gpu up comfyui-multigpu  → http://localhost:8190
#
# 注意：CUDA UMD 13.3 驅動向下相容，CUDA 12.6 映像可正常執行。
#       如需完整 cu130 效能，使用：docker compose build --build-arg CUDA_TAG=13.0
# ─────────────────────────────────────────────────────────────────────────────

# ── 共用設定區塊 (YAML anchor) ────────────────────────────────────────────────
x-comfyui-base: &comfyui-base
  image: superyc1121/comfyui:latest
  restart: unless-stopped
  volumes:
    - /mnt/comfyui/models:/app/models
    - /mnt/comfyui/output:/app/output
    - /mnt/comfyui/input:/app/input
    - /mnt/comfyui/custom_nodes:/app/custom_nodes
    - /mnt/comfyui/user:/app/user
  environment:
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

services:

  # ── 模式 A：預設使用第二張 GPU (GPU 1) ───────────────────────────────────────
  comfyui:
    <<: *comfyui-base
    container_name: comfyui
    ports:
      - "8188:8188"
    command: ["python", "main.py", "--listen", "0.0.0.0", "--port", "8188", "--cuda-device", "0", "--enable-manager"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=1          # 只看到 GPU 1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - COMFYUI_DB_NAME=comfyui
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]             # 強制鎖定第 1 號 GPU
              capabilities: [gpu]

  # ── 模式 B：兩個獨立容器，各鎖定一張 GPU ─────────────────────────────────
  comfyui-gpu0:
    <<: *comfyui-base
    container_name: comfyui-gpu0
    ports:
      - "8188:8188"
    command: ["python", "main.py", "--listen", "0.0.0.0", "--port", "8188", "--cuda-device", "0", "--enable-manager"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=0          # 只看到 GPU 0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - COMFYUI_DB_NAME=comfyui-gpu0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    profiles: [multi-gpu]

  comfyui-gpu1:
    <<: *comfyui-base
    container_name: comfyui-gpu1
    ports:
      - "8189:8188"                       # 換個 host port 避免衝突
    command: ["python", "main.py", "--listen", "0.0.0.0", "--port", "8188", "--cuda-device", "0", "--enable-manager"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=1          # 只看到 GPU 1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - COMFYUI_DB_NAME=comfyui-gpu1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    profiles: [multi-gpu]

  # ── 模式 C：單容器同時看到兩張 GPU，交由 ComfyUI-MultiGPU 節點分派載入 ────────────
  # entrypoint.sh 偵測到多於 1 張可見 GPU 時會自動不加 --cuda-device，
  # 讓兩張卡都留給 ComfyUI 進程，在工作流節點上選 cuda:0 / cuda:1 分派模型。
  comfyui-multigpu:
    <<: *comfyui-base
    container_name: comfyui-multigpu
    ports:
      - "8190:8188"
    command: ["python", "main.py", "--listen", "0.0.0.0", "--port", "8188", "--enable-manager"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=0,1         # 兩張卡同時可見
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - COMFYUI_DB_NAME=comfyui-multigpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1"]
              capabilities: [gpu]
    profiles: [multi-gpu]
